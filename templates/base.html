<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Intelligent Management System{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Left Sidebar -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-chart-line"></i> IMS</h2>
                <p>Intelligent Management System</p>
            </div>
            
            <ul class="sidebar-menu">
                <li class="menu-item active">
                    <a href="#dashboard" data-section="dashboard">
                        <i class="fas fa-tachometer-alt"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="#upload" data-section="upload">
                        <i class="fas fa-upload"></i>
                        <span>Upload Data</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="#workflow" data-section="workflow">
                        <i class="fas fa-cogs"></i>
                        <span>Run Workflow</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="#logs" data-section="logs">
                        <i class="fas fa-terminal"></i>
                        <span>Live Logs</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="#results" data-section="results">
                        <i class="fas fa-file-alt"></i>
                        <span>Results</span>
                    </a>
                </li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <header class="main-header">
                <h1>{% block header %}Dashboard{% endblock %}</h1>
                <div class="header-actions">
                    <div class="status-indicator" id="workflowStatus">
                        <i class="fas fa-circle"></i>
                        <span>Ready</span>
                    </div>
                </div>
            </header>

            <div class="content-wrapper">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container"></div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay hidden">
        <div class="loading-spinner">
            <i class="fas fa-spinner fa-spin"></i>
            <p>Processing...</p>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
